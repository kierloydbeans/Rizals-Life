<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rizal Footsteps: An Interactive Spatial Map of Jose Rizal's Life</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="m-0 p-0 overflow-hidden">
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="fixed inset-0 bg-amber-50 z-[3000] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 text-center transform transition-all border-2 border-amber-200 relative z-10">
            <div class="mb-6">
                <div class="w-20 h-20 mx-auto mb-4 bg-amber-100 rounded-full flex items-center justify-center">
                    <i data-lucide="compass" class="w-10 h-10 text-amber-800"></i>
                </div>
                <h1 class="text-3xl font-bold text-amber-900 mb-2">Welcome, Time Traveler!</h1>
                <p class="text-amber-800 text-lg leading-relaxed">
                    Are you ready to relive the life of our national hero, Dr. Jose Rizal?
                </p>
            </div>
            <button id="start-journey-btn" class="w-full bg-amber-800 text-white py-4 px-6 rounded-xl font-semibold text-lg hover:bg-amber-900 transition-all shadow-lg hover:shadow-xl transform hover:scale-105 cursor-pointer">
                Begin Journey
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map" class="w-full h-screen"></div>
    
    <!-- In Transit Banner -->
    <div id="transit-banner" class="fixed top-0 left-0 right-0 bg-gray-500 text-white text-center py-3 px-4 transform -translate-y-full transition-transform duration-500 z-[1500]">
        <div class="flex items-center justify-center gap-3">
            <div id="transit-icon" class="w-8 h-8"></div>
            <span id="transit-message" class="font-semibold text-lg"></span>
        </div>
    </div>
    
    <!-- Bottom Sheet / Drawer -->
    <div id="drawer" class="absolute bottom-0 left-0 right-0 sm:absolute sm:right-0 sm:top-0 sm:left-auto sm:h-full sm:w-80 sm:bottom-auto bg-white z-[1000] transition-all duration-300 ease-in-out shadow-2xl">
        <!-- Mobile Handle -->
        <div id="drawer-handle" class="sm:hidden w-full flex justify-center py-3 cursor-pointer bg-gray-100 border-b border-gray-200">
            <div class="w-12 h-1.5 bg-gray-400 rounded-full"></div>
        </div>
        
        <div class="h-full flex flex-col sm:h-full">
            <!-- Drawer Header -->
            <div class="p-5 border-b border-gray-300 bg-white flex justify-between items-center">
                <h2 id="drawer-title" class="text-xl font-bold uppercase tracking-wide text-gray-900"></h2>
                <div class="flex gap-2">
                    <button id="toggle-drawer" class="sm:hidden text-gray-600 hover:text-gray-900 transition-transform">
                        <i data-lucide="chevron-up" class="w-6 h-6"></i>
                    </button>
                    <button id="close-drawer" class="text-gray-600 hover:text-gray-900">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
            
            <!-- Drawer Content -->
            <div class="flex-1 overflow-y-auto p-5">
                <!-- Significant Events -->
                <div class="mb-6">
                    <h3 class="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wide">Significant Events</h3>
                    <ul id="events-list" class="space-y-2"></ul>
                </div>
                
                <!-- Photo Grid -->
                <div class="mb-6">
                    <h3 class="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wide">Gallery</h3>
                    <div id="photo-grid" class="space-y-2"></div>
                </div>
                
                <!-- Rating Widget -->
                <div class="mb-6">
                    <h3 class="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wide">How'd you like this place?</h3>
                    <div id="rating-widget" class="flex gap-1"></div>
                </div>
            </div>
            
            <!-- Next Stop Button -->
            <div class="p-5 border-t border-gray-300 bg-white flex-shrink-0">
                <button id="next-stop-btn" class="w-full bg-gray-500 text-white py-3 px-4 rounded-lg font-semibold hover:bg-gray-600 transition-all flex items-center justify-center gap-2">
                    <span id="next-stop-text">Next stop -></span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modal Detail Window -->
    <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-gray-100 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-hidden transform transition-all">
            <!-- Modal Header -->
            <div class="p-5 border-b border-gray-300 bg-gray-100 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-bold uppercase tracking-wide text-gray-900"></h3>
                <button id="close-modal" class="text-gray-600 hover:text-gray-900">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <!-- Modal Content -->
            <div class="p-5 overflow-y-auto max-h-[60vh]">
                <p id="modal-description" class="text-gray-800 leading-relaxed mb-6"></p>
                <div id="modal-images"></div>
            </div>
            
            <!-- Modal Footer -->
            <div class="p-5 border-t border-gray-300 bg-gray-100 flex justify-end">
                <button id="modal-nav-btn" class="bg-gray-500 text-white py-2 px-4 rounded-lg font-semibold hover:bg-gray-600 transition-all flex items-center gap-2">
                    <span id="modal-nav-text">Rizal's Home</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Data -->
    <script src="data.js"></script>
    
    <!-- Main App -->
    <script src="app.js"></script>
</body>
</html>
